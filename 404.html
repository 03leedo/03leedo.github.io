<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지 없음 · 이도헌</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding-block: 48px; }
    .nf__box { max-width: 560px; display: grid; gap: 18px; }
    .nf__code { font-family: var(--mono); font-size: clamp(4rem, 16vw, 7rem); font-weight: 800; letter-spacing: -.05em; line-height: 1; }
    .nf__code span {
      background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat;
      background-position: 0 85%; background-size: 100% .3em;
    }
    .nf h1 { font-size: 1.5rem; font-weight: 800; }
    .nf p { color: var(--ink-2); }
  </style>
</head>
<body>
  <main class="nf wrap">
    <div class="nf__box">
      <p class="nf__code" aria-hidden="true"><span>404</span></p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>이 주소에는 페이지가 없습니다. 주소를 다시 확인하거나 첫 화면으로 돌아가 주세요.</p>
      <p><a class="btn btn--solid" href="/">포트폴리오로 돌아가기</a></p>
    </div>
  </main>
</body>
</html>
